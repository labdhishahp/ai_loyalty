[project]
name = "lmart"
version = "0.1.0"
description = "L-Mart AI Loyalty Operations Employee"
# 3.12 is set by the DEPLOYMENT TARGET, not by preference. Vercel's Python
# builder reads this field to choose an interpreter, and @vercel/python@17
# installs vercel-runtime, which requires >=3.12. Leaving 3.11 here makes the
# builder select 3.11 and then fail to resolve its own runtime -- the build
# error names vercel-runtime, not this line, so it is worth saying why.
requires-python = ">=3.12"

# Kept in step with requirements.txt, which is what Vercel installs. The two
# drifted once -- pyproject had `mcp`, requirements.txt did not -- and the
# result was a deployment that could not import. Same set, same bounds, and a
# test asserts they agree.
#
# The seed generator itself uses only the standard library (random, csv,
# datetime) so that data generation stays reproducible without a numeric stack.
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "anthropic>=1.7,<2",
    "openai>=1.60,<4",
    "mcp>=2.2,<3",
    "PyJWT>=2.9,<3",
]

# Declared explicitly because the repo has two top-level directories and
# setuptools refuses to guess between them. `db/` holds scripts run directly
# (python db/migrate.py), not an importable package.
[tool.setuptools]
packages = ["seed", "metrics", "core", "tools", "llm", "agent", "api", "knowledge", "actions", "scripts", "mcp_server"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
